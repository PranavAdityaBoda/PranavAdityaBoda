    <text x="24" y="66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#D9A066" xml:space="preserve">2023-07 -- PRESENT   Software Engineer @ Strand Life Sciences</text><text x="24" y="87" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#E6EDF3" xml:space="preserve">&gt; Migrated a monolithic EC2 workflow service to an event-driven</text><text x="24" y="108" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8B949E" xml:space="preserve">  microservices architecture (SQS, S3, RDS/Postgres, Redis, IAM).</text><text x="24" y="129" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#D9A066" xml:space="preserve">  3x throughput, p99 latency 800ms to 250ms.</text><text x="24" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#E6EDF3" xml:space="preserve">&gt; Runs production on AWS EKS with Docker/Kubernetes,</text><text x="24" y="171" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#D9A066" xml:space="preserve">  99.5% uptime SLO through 10x traffic spikes.</text><text x="24" y="192" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#E6EDF3" xml:space="preserve">&gt; Rebuilt a 20M-row pandas reporting pipeline on ClickHouse + S3.</text><text x="24" y="213" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#D9A066" xml:space="preserve">  Load times cut by over 90%.</text><text x="24" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#E6EDF3" xml:space="preserve">&gt; Built an MCP server exposing production DB analytics through</text><text x="24" y="255" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8B949E" xml:space="preserve">  a self-serve dashboard for product/business teams.</text><text x="24" y="276" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#E6EDF3" xml:space="preserve">&gt; Owns on-call, post-mortems, and CI/CD. Release time cut 50%.</text><text x="24" y="318" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#D9A066" xml:space="preserve">2022-05 -- 2022-07   Product &amp; Technology Intern @ nVipani</text><text x="24" y="339" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#E6EDF3" xml:space="preserve">&gt; Angular/TypeScript features for Shopconnect-B2C.</text><text x="24" y="360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#E6EDF3" xml:space="preserve">&gt; Cut bug backlog by 30% resolving critical production issues.</text>
