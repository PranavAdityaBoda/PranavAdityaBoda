  <text x="776" y="23" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1" fill="#FFFFFF">EXPERIENCE.LOG</text>
  <text x="22" y="60" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#9C3D28" xml:space="preserve">[2023-07 .. PRESENT]  Software Engineer @ Strand Life Sciences</text><text x="22" y="81" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#241812" xml:space="preserve">  &gt; Migrated a monolithic EC2 workflow service to an event-driven</text><text x="22" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#6B5A4E" xml:space="preserve">    microservices architecture (SQS, S3, RDS/Postgres, Redis, IAM).</text><text x="22" y="123" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#C1704A" xml:space="preserve">    3x throughput, p99 latency 800ms -&gt; 250ms.</text><text x="22" y="144" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#241812" xml:space="preserve">  &gt; Runs production on AWS EKS with Docker/Kubernetes,</text><text x="22" y="165" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#C1704A" xml:space="preserve">    99.5% uptime SLO through 10x traffic spikes.</text><text x="22" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#241812" xml:space="preserve">  &gt; Rebuilt a 20M-row pandas reporting pipeline on ClickHouse + S3.</text><text x="22" y="207" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#C1704A" xml:space="preserve">    Load times cut by over 90%.</text><text x="22" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#241812" xml:space="preserve">  &gt; Built an MCP server exposing production DB analytics through</text><text x="22" y="249" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#6B5A4E" xml:space="preserve">    a self-serve dashboard for product/business teams.</text><text x="22" y="270" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#241812" xml:space="preserve">  &gt; Owns on-call, post-mortems, and CI/CD. Release time cut 50%.</text><text x="22" y="312" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#9C3D28" xml:space="preserve">[2022-05 .. 2022-07]  Product &amp; Technology Intern @ nVipani</text><text x="22" y="333" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#241812" xml:space="preserve">  &gt; Angular/TypeScript features for Shopconnect-B2C.</text><text x="22" y="354" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#241812" xml:space="preserve">  &gt; Cut bug backlog by 30% resolving critical production issues.</text>
