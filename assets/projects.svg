    <text x="774" y="26" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">PROJECTS</text>
    <text x="24" y="66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#D9A066" xml:space="preserve">[AI Code Documentation Agent]</text><text x="24" y="87" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#CC5A32" xml:space="preserve">  Python, FastAPI, LangChain, Chroma, RAG, Streamlit</text><text x="24" y="108" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#E6EDF3" xml:space="preserve">  Clones any GitHub repo, chunks it via tree-sitter AST parsing,</text><text x="24" y="129" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#E6EDF3" xml:space="preserve">  and generates API references, READMEs and beginner guides</text><text x="24" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#E6EDF3" xml:space="preserve">  through a RAG pipeline grounded in the real codebase. Cuts</text><text x="24" y="171" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#E6EDF3" xml:space="preserve">  documentation turnaround from days to minutes.</text><text x="24" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#D9A066" xml:space="preserve">[Permutation Polynomials as Verifiable Delay Functions]</text><text x="24" y="225" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#CC5A32" xml:space="preserve">  C++, Python, Intel IPP-Crypto, SageMath</text><text x="24" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#E6EDF3" xml:space="preserve">  Applies finite field arithmetic and number theory to evaluate</text><text x="24" y="267" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#E6EDF3" xml:space="preserve">  permutation polynomials as VDFs, a cryptographic primitive for</text><text x="24" y="288" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#E6EDF3" xml:space="preserve">  trustless randomness. Demonstrates a 4x speed improvement over</text><text x="24" y="309" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#E6EDF3" xml:space="preserve">  SageMath baselines using Intel IPP-Crypto.</text>
  </g>
